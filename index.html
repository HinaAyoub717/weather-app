<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather App</title>
<style>
  :root { --sky: #dff1fb; --ink: #12304a; --card: #ffffff; --accent: #1f7ac4; --error: #b3261e; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: var(--ink);
    background: linear-gradient(180deg, var(--sky), #f7fbff);
  }
  main { width: 100%; max-width: 380px; background: var(--card); border-radius: 20px; padding: 1.5rem; box-shadow: 0 8px 30px rgba(18,48,74,.12); }
  h1 { margin: 0 0 1rem; font-size: 1.4rem; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .7rem .9rem; border: 2px solid #c9dceb; border-radius: 10px; font-size: 1rem; }
  input:focus, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  button { padding: .7rem 1rem; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer; }
  #error { color: var(--error); margin: 1rem 0 0; min-height: 1.2em; }
  #result { text-align: center; margin-top: 1rem; }
  #result[hidden] { display: none; }
  #icon { font-size: 4.5rem; line-height: 1; }
  #city { margin: .5rem 0 0; font-size: 1.3rem; }
  #temp { font-size: 2.6rem; font-weight: bold; margin: .2rem 0; }
  #condition { margin: 0 0 1rem; font-size: 1.1rem; }
  #humidity { margin: 0; padding: .7rem; background: var(--sky); border-radius: 10px; }
</style>
</head>
<body>
<main>
  <h1>Weather App</h1>
  <form id="search-form">
    <input id="city-input" type="text" placeholder="Enter a city name" aria-label="City name" required>
    <button type="submit">Search</button>
  </form>
  <p id="error" role="alert"></p>
  <section id="result" hidden>
    <div id="icon" aria-hidden="true"></div>
    <h2 id="city"></h2>
    <p id="temp"></p>
    <p id="condition"></p>
    <p id="humidity"></p>
  </section>
</main>

<script>
  // Open-Meteo needs no API key, so nothing secret goes on GitHub.
  const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
  const WEATHER_URL = "https://api.open-meteo.com/v1/forecast";

  const form = document.getElementById("search-form");
  const input = document.getElementById("city-input");
  const errorEl = document.getElementById("error");
  const resultEl = document.getElementById("result");

  // Map Open-Meteo weather codes to an icon and a label.
  function describe(code) {
    if (code === 0) return { icon: "☀️", text: "Sunny" };
    if (code <= 3) return { icon: "☁️", text: "Cloudy" };
    if (code === 45 || code === 48) return { icon: "🌫️", text: "Foggy" };
    if (code >= 51 && code <= 67) return { icon: "🌧️", text: "Rainy" };
    if (code >= 71 && code <= 77) return { icon: "❄️", text: "Snowy" };
    if (code >= 80 && code <= 82) return { icon: "🌧️", text: "Rainy" };
    if (code >= 95) return { icon: "⛈️", text: "Thunderstorm" };
    return { icon: "☁️", text: "Cloudy" };
  }

  async function getWeather(cityName) {
    // Step 1: city name -> coordinates
    const geoRes = await fetch(`${GEO_URL}?name=${encodeURIComponent(cityName)}&count=1`);
    if (!geoRes.ok) throw new Error("Could not reach the weather service.");
    const geo = await geoRes.json();
    if (!geo.results || geo.results.length === 0) {
      throw new Error(`City "${cityName}" not found. Check the spelling and try again.`);
    }
    const { latitude, longitude, name, country } = geo.results[0];

    // Step 2: coordinates -> current weather
    const url = `${WEATHER_URL}?latitude=${latitude}&longitude=${longitude}` +
                `&current=temperature_2m,relative_humidity_2m,weather_code`;
    const wRes = await fetch(url);
    if (!wRes.ok) throw new Error("Could not load weather data.");
    const data = await wRes.json();
    return { name, country, current: data.current };
  }

  function render({ name, country, current }) {
    const { icon, text } = describe(current.weather_code);
    document.getElementById("icon").textContent = icon;
    document.getElementById("city").textContent = `${name}, ${country}`;
    document.getElementById("temp").textContent = `${Math.round(current.temperature_2m)}°C`;
    document.getElementById("condition").textContent = text;
    document.getElementById("humidity").textContent = `Humidity: ${current.relative_humidity_2m}%`;
    resultEl.hidden = false;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const city = input.value.trim();
    errorEl.textContent = "";
    resultEl.hidden = true;
    if (!city) { errorEl.textContent = "Please enter a city name."; return; }
    try {
      render(await getWeather(city));
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
